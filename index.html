<!DOCTYPE html>
<html lang="js">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Earth Simulator</title>
    </head>
    <body>
        <div id="container">
            X: <span id="x">0</span>, Y: <span id="y">0</span>, Z: <span id="z">0</span>
            <br>View target / X: <span id="viewX">0</span>, Y: <span id="viewY">0</span>, Z: <span id="viewZ">0</span>
            <br>Zoom: <span id="zoom">0</span>
        </div>
        <canvas id="can"></canvas>
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
            #container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                color: white;
            }
            .hidden {
                display: none;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
                "three/examples/jsm/libs/stats.module" : "https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"
                }
            }
        </script>
        <script src="main.js" type="module"></script>
    </body>
</html>
